name: JobPilot 验证

# 只检查主分支代码和准备合入的改动；纯文档更新不重复启动浏览器和容器。
"on":
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交替代旧检查，避免排队和重复通知；不取消其他分支。
concurrency:
  group: jobpilot-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  offline:
    name: Windows 功能与浏览器检查
    # 桌面使用以 Windows + Edge 为基准；Linux 只承担下方服务端部署验收。
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BROWSER_CHANNEL: msedge
      BROWSER_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements.lock.txt
      - name: Python 全量测试
        run: python -m pytest -q --junitxml=data/ci/junit.xml
      - name: BOSS 助手脚本测试（虚构页面）
        run: node --test tests/browser_probe/*.test.mjs
      - name: 网页操作与历史清理
        run: python -m scripts.dashboard_smoke
      - name: 任务进度推送
        run: python -m scripts.stream_smoke
      - name: 浏览器导航诊断（虚构页面）
        run: python -m scripts.navigation_smoke
      - name: 牛客解析与暂停（虚构页面）
        run: python -m scripts.platform_smoke nowcoder
      - name: MCP 工具通信
        run: python -m scripts.mcp_smoke
      - name: 离线评估与浏览器工具
        run: python -m app.evaluation.runner --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-verification
          # 只保存虚构验收产物，不上传 data 全目录或任何真实资料。
          path: |
            data/ci/junit.xml
            data/evaluations/latest.json
            data/dashboard-smoke.png
            data/resume-smoke.png
          retention-days: 7

  postgres:
    name: PostgreSQL 迁移与检查点
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_DB: jobpilot_test
          # 仅供本次临时服务，不是部署密码或真实凭据。
          POSTGRES_PASSWORD: synthetic_ci_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBPILOT_TEST_POSTGRES_URL: postgresql://jobpilot:synthetic_ci_database@127.0.0.1:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest tests/integration/test_relational_storage.py -q

  compose:
    name: 容器启动与重启恢复
    # 三项检查独立执行；某一项失败不再遮蔽另外两项的结果。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m scripts.deployment_check
      - run: python -m scripts.docker_smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-verification
          path: data/deployment/*/report.json
          retention-days: 7
