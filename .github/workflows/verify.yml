name: JobPilot 验证

# 没有定时任务；只有提交、PR 或手动运行才会执行。
"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: 离线回归与浏览器演示
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            channel: msedge
          - os: ubuntu-latest
            channel: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BROWSER_CHANNEL: ${{ matrix.channel }}
      BROWSER_HEADLESS: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --junitxml=data/ci/junit.xml
      - run: python -m scripts.dashboard_smoke
      - run: python -m scripts.navigation_smoke
      - run: python -m scripts.platform_smoke nowcoder
      - run: python -m scripts.mcp_smoke
      - run: python -m app.evaluation.runner --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-${{ matrix.os }}
          # 只保存虚构验收产物，不上传 data 全目录或任何真实资料。
          path: |
            data/ci/junit.xml
            data/evaluations/latest.json
            data/dashboard-smoke.png
            data/resume-smoke.png
          retention-days: 7

  postgres:
    name: PostgreSQL 迁移与检查点
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_DB: jobpilot_test
          # 仅供本次临时服务，不是部署密码或真实凭据。
          POSTGRES_PASSWORD: synthetic_ci_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBPILOT_TEST_POSTGRES_URL: postgresql://jobpilot:synthetic_ci_database@127.0.0.1:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest tests/integration/test_relational_storage.py -q

  compose:
    name: 容器启动与重启恢复
    needs: [offline, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m scripts.deployment_check
      - run: python -m scripts.docker_smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-verification
          path: data/deployment/*/report.json
          retention-days: 7
