# 服务只映射本机端口。数据库就绪并完成迁移后才启动应用。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_DB: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["python", "-m", "app.db_cli", "upgrade"]
    environment:
      AGENT_DATABASE_URL: postgresql://jobpilot:${POSTGRES_PASSWORD}@db:5432/jobpilot
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - agent-data:/app/data
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_DATABASE_URL: postgresql://jobpilot:${POSTGRES_PASSWORD}@db:5432/jobpilot
      JOBPILOT_API_TOKEN: ${JOBPILOT_API_TOKEN:?请在 .env 设置 JOBPILOT_API_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_INPUT_PRICE_PER_MILLION: ${LLM_INPUT_PRICE_PER_MILLION:-}
      LLM_OUTPUT_PRICE_PER_MILLION: ${LLM_OUTPUT_PRICE_PER_MILLION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - agent-data:/app/data
      - browser-profiles:/app/profiles
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
  agent-data:
  browser-profiles:
